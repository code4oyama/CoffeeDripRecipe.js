<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーヒードリップレシピ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ コーヒードリップレシピ</h1>
        </header>

        <main>
            <div class="input-section">
                                <div class="form-group">
                                    <label for="roast-level">焙煎度:</label>
                                    <div class="radio-group radio-group-five">
                                        <label class="radio-label">
                                            <input type="radio" name="roast-level" value="lightest" checked>
                                            <span>浅煎り</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="roast-level" value="light">
                                            <span>やや浅煎り</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="roast-level" value="medium">
                                            <span>中煎り</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="roast-level" value="dark">
                                            <span>やや深煎り</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="roast-level" value="darkest">
                                            <span>深煎り</span>
                                        </label>
                                    </div>
                                </div>
                <div class="form-group">
                    <label for="brew-type">タイプ:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="brew-type" value="hot" checked>
                            <span>ホット</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="brew-type" value="iced">
                            <span>アイス</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="strength">濃さ:</label>
                    <div class="radio-group radio-group-three">
                        <label class="radio-label">
                            <input type="radio" name="strength" value="light">
                            <span>薄め</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="strength" value="normal" checked>
                            <span>普通</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="strength" value="strong">
                            <span>濃いめ</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cup-size">カップサイズ:</label>
                    <div class="radio-group radio-group-three">
                        <label class="radio-label">
                            <input type="radio" name="cup-size" value="small">
                            <span>小さめ<br>250ml</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="cup-size" value="normal" checked>
                            <span>普通<br>330ml</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="cup-size" value="large">
                            <span>大きめ<br>560ml</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cups">カップ数 <span id="cup-size-label">(330ml/杯)</span>:</label>
                    <input type="number" id="cups" min="1" max="10" value="1">
                </div>

                <div class="form-group">
                    <label for="water-ratio">豆:お湯の比率 (1:x):</label>
                    <input type="number" id="water-ratio" min="10" max="25" step="0.1" value="17.2">
                </div>

                <button id="calculate-btn" class="btn-primary">レシピを計算</button>
            </div>

            <div class="result-section" id="result-section" style="display: none;">
                <h2>レシピ</h2>
                
                <div class="recipe-card recipe-card-highlight">
                    <div class="recipe-item">
                        <span class="recipe-label">温めるお湯の量（合計）:</span>
                        <span class="recipe-value" id="total-hot-water"></span>
                    </div>
                </div>

                <div class="recipe-card" id="warmup-card" style="display: none;">
                    <div class="recipe-item">
                        <span class="recipe-label">カップを温める水の量:</span>
                        <span class="recipe-value" id="warmup-water"></span>
                    </div>
                </div>

                <div class="recipe-card" id="ice-card" style="display: none;">
                    <div class="recipe-item">
                        <span class="recipe-label">氷の量:</span>
                        <span class="recipe-value" id="ice-amount"></span>
                    </div>
                </div>

                <div class="recipe-card">
                    <div class="recipe-item">
                        <span class="recipe-label">豆:お湯の比率:</span>
                        <span class="recipe-value" id="brew-ratio"></span>
                    </div>
                    <div class="recipe-item">
                        <span class="recipe-label">お湯の温度:</span>
                        <span class="recipe-value" id="water-temp"></span>
                    </div>
                    <div class="recipe-item">
                        <span class="recipe-label">豆の挽き具合:</span>
                        <span class="recipe-value" id="grind-size"></span>
                    </div>
                    <div class="recipe-item">
                        <span class="recipe-label">コーヒー豆の量:</span>
                        <span class="recipe-value" id="coffee-beans"></span>
                    </div>
                    <div class="recipe-item">
                        <span class="recipe-label">抽出用のお湯の量:</span>
                        <span class="recipe-value" id="total-water"></span>
                    </div>
                    <div class="recipe-item">
                        <span class="recipe-label">抽出時間:</span>
                        <span class="recipe-value" id="brew-time"></span>
                    </div>
                </div>

                <div class="recipe-card">
                    <h3>お湯を注ぐタイミング</h3>
                    <div class="pour-steps" id="pour-steps"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; <a href="https://mirai-system.org" target="_blank" rel="noopener">mirai-system.org</a></p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
